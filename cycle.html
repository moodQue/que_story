<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Que — Territory Cycle</title>
  <link rel="stylesheet" href="css/centroids.css">
  <style>
    body { overflow: hidden; }

    .cycle-wrap {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 0;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease;
    }

    .cycle-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
        rgba(7,17,28,.95) 0%,
        rgba(7,17,28,.72) 52%,
        rgba(7,17,28,.28) 100%);
    }

    .cycle-card {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
      padding: clamp(28px, 6vw, 60px);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      gap: 24px;
    }

    .territory-eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
    }

    .territory-name {
      font-size: clamp(48px, 11vw, 100px);
      margin: 0;
      line-height: 1;
    }

    .territory-count {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .story-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .story-list li {
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .story-list li:last-child {
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .story-title { font-size: 15px; font-weight: 700; color: var(--ink); }

    .story-blurb {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Progress bar */
    .progress-bar-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,.08);
      z-index: 10;
    }

    .progress-bar {
      height: 100%;
      background: var(--gold);
      width: 0%;
      transition: width linear;
    }

    /* Territory dots */
    .dot-row {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      transition: background .3s;
    }

    .dot.active { background: var(--gold); }
  </style>
</head>
<body>
  <main class="page" style="padding:0;">
    <div class="cycle-wrap" id="cycle-wrap">
      <div class="cycle-overlay"></div>
      <div class="cycle-card">
        <div class="territory-eyebrow" id="eyebrow">Signal · Territory</div>
        <h1 class="territory-name" id="territory-name">Que</h1>
        <div class="territory-count" id="territory-count">Loading signals…</div>
        <ul class="story-list" id="story-list"></ul>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="dot-row" id="dot-row"></div>
  </main>

  <script>
    (function () {
      var STORIES_URL = "https://moodque.github.io/que_story/data/stories.json";
      var CYCLE_MS    = 30000; // 30 seconds per territory
      var MAX_STORIES = 5;     // stories shown per territory

      var TERRITORY_LABELS = {
        alignment: "The Alignment",
        flowstate: "The Flowstate",
      };

      var TERRITORY_BG = {
        alignment: "assets/centroids/the-calm-night.png",
        flowstate:  "assets/centroids/the-calm-night.png",
      };

      var territories = [];
      var idx = 0;
      var timer = null;
      var progressTimer = null;

      function esc(s) {
        return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function label(tid) {
        return TERRITORY_LABELS[tid] || (tid.charAt(0).toUpperCase() + tid.slice(1));
      }

      function buildDots() {
        var row = document.getElementById("dot-row");
        row.innerHTML = "";
        territories.forEach(function (_, i) {
          var d = document.createElement("div");
          d.className = "dot" + (i === idx ? " active" : "");
          d.id = "dot-" + i;
          row.appendChild(d);
        });
      }

      function updateDots() {
        territories.forEach(function (_, i) {
          var d = document.getElementById("dot-" + i);
          if (d) d.className = "dot" + (i === idx ? " active" : "");
        });
      }

      function startProgress() {
        clearTimeout(progressTimer);
        var bar = document.getElementById("progress-bar");
        bar.style.transition = "none";
        bar.style.width = "0%";
        // Force reflow before starting transition
        bar.offsetWidth;
        bar.style.transition = "width " + CYCLE_MS + "ms linear";
        bar.style.width = "100%";
      }

      function render(t) {
        var wrap = document.getElementById("cycle-wrap");
        var bg = TERRITORY_BG[t.id] || "assets/centroids/the-calm-night.png";
        wrap.style.backgroundImage = 'url("' + bg + '")';

        document.getElementById("eyebrow").textContent =
          "Territory · " + t.id.toUpperCase();
        document.getElementById("territory-name").textContent = label(t.id);
        document.getElementById("territory-count").textContent =
          t.stories.length + " signal" + (t.stories.length !== 1 ? "s" : "") + " logged";

        var list = document.getElementById("story-list");
        list.innerHTML = "";
        t.stories.slice(0, MAX_STORIES).forEach(function (s) {
          var li = document.createElement("li");
          li.innerHTML =
            '<span class="story-title">' + esc(s.title) + "</span>" +
            '<span class="story-blurb">' + esc(s.blurb) + "</span>";
          list.appendChild(li);
        });
      }

      function advance() {
        idx = (idx + 1) % territories.length;
        updateDots();
        render(territories[idx]);
        startProgress();
      }

      function startCycle() {
        buildDots();
        render(territories[idx]);
        startProgress();
        timer = setInterval(advance, CYCLE_MS);
      }

      fetch(STORIES_URL)
        .then(function (r) { return r.json(); })
        .then(function (stories) {
          var byTerritory = {};
          Object.entries(stories).forEach(function (entry) {
            var id   = entry[0];
            var s    = entry[1];
            var tid  = s.territory_id || "";
            if (!tid) return;
            if (!byTerritory[tid]) byTerritory[tid] = [];
            byTerritory[tid].push({ id: id, title: s.title, blurb: s.blurb });
          });

          // Sort newest-first within each territory (issue_id is date-prefixed)
          Object.keys(byTerritory).forEach(function (tid) {
            byTerritory[tid].sort(function (a, b) {
              return b.id.localeCompare(a.id);
            });
          });

          // Build territory list sorted by story count desc
          territories = Object.keys(byTerritory)
            .sort(function (a, b) {
              return byTerritory[b].length - byTerritory[a].length;
            })
            .map(function (tid) {
              return { id: tid, stories: byTerritory[tid] };
            });

          if (!territories.length) {
            document.getElementById("territory-count").textContent =
              "No signals available.";
            return;
          }

          startCycle();
        })
        .catch(function () {
          document.getElementById("territory-count").textContent =
            "Signal error — check connection.";
        });
    })();
  </script>
</body>
</html>
