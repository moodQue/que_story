<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Que — The Mood Djinn</title>

  <style>
    body {
      margin: 0;
      background: #0b0f0d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .comic-image {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0,0,0,.55);
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      margin-top: 18px;
    }

    .story {
      color: #d7d7d7;
      font-size: 17px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .qr-box {
      margin-top: 22px;
      padding: 16px;
      background: #111a17;
      border-radius: 14px;
      display: inline-block;
    }

    .qr-box img {
      width: 160px;
      height: 160px;
    }

    .small {
      color: #aaa;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <img id="comicImage" class="comic-image" src="" alt="Que Comic Scene" />
    <div id="title" class="title">Loading...</div>
    <div id="story" class="story"></div>

    <div class="qr-box">
      <img id="qrCode" src="" alt="Story QR Code" />
      <div class="small">Scan to return to this story moment</div>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1do3Qbf_oCKeWT8cePoSib4XnodAbUs9t_QjiEUeFCbQ/edit?usp=sharing";

    const params = new URLSearchParams(window.location.search);
    const storyId = params.get("story") || "QUE-001";

    async function loadStory() {
      const response = await fetch(SHEET_CSV_URL);
      const csvText = await response.text();
      const rows = parseCSV(csvText);

      const story = rows.find(row => row.story_id === storyId);

      if (!story) {
        document.getElementById("title").innerText = "Story Not Found";
        document.getElementById("story").innerText = "This Que signal has not been created yet.";
        return;
      }

      document.getElementById("comicImage").src =
        story.image_url || `assets/centroids/${story.centroid}_${story.time_block}.png`;

      document.getElementById("title").innerText =
        `${story.title} — ${story.centroid.toUpperCase()} • ${story.time_block.toUpperCase()}`;

      document.getElementById("story").innerText = story.story;

      const currentUrl = `${window.location.origin}${window.location.pathname}?story=${story.story_id}`;

      document.getElementById("qrCode").src =
        `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(currentUrl)}`;
    }

    function parseCSV(text) {
      const lines = text.trim().split("\n");
      const headers = lines[0].split(",").map(h => h.trim());

      return lines.slice(1).map(line => {
        const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        const row = {};

        headers.forEach((header, index) => {
          row[header] = (values[index] || "")
            .replace(/^"|"$/g, "")
            .replace(/""/g, '"')
            .trim();
        });

        return row;
      });
    }

    loadStory();
  </script>
</body>
</html>
