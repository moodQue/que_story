# Minimal CI for que_story — added by Phase 0 of the MoodQue Experience Engine refactor.
#
# que_story is a GitHub Pages site with no test suite. The highest-value safe check is that the
# JSON and YAML data files the site actually fetches at runtime still parse. A malformed
# data/stories.json silently blanks the public site, because assets/story-loader.js fails soft.
#
# This job does NOT validate schema shape yet — that arrives with the Mood Package contract.
# No secrets, no deploys.

name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  data-files-parse:
    name: site data parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip pyyaml

      - name: Validate JSON data files
        run: |
          python - <<'PY'
          import json, sys, pathlib

          # Files the published site fetches or that drive generation.
          targets = [
              "data/stories.json",
              "tokens.json",
              "scenes/scenes.json",
          ]
          failed = []
          for rel in targets:
              p = pathlib.Path(rel)
              if not p.exists():
                  print(f"SKIP  {rel} (not present)")
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"OK    {rel}")
              except Exception as exc:
                  print(f"FAIL  {rel}: {exc}")
                  failed.append(rel)
          sys.exit(1 if failed else 0)
          PY

      - name: Validate YAML config files
        run: |
          python - <<'PY'
          import sys, pathlib, yaml

          failed = []
          for p in sorted(pathlib.Path("configs").glob("*.yaml")) if pathlib.Path("configs").is_dir() else []:
              try:
                  yaml.safe_load(p.read_text(encoding="utf-8"))
                  print(f"OK    {p}")
              except Exception as exc:
                  print(f"FAIL  {p}: {exc}")
                  failed.append(str(p))
          sys.exit(1 if failed else 0)
          PY

      - name: Report known stale token (informational)
        run: |
          if grep -q "flowstate" tokens.json 2>/dev/null; then
            echo "::warning file=tokens.json::Stale 'flowstate' territory id still present — tracked as a known defect, removal deferred to a later phase."
          fi
