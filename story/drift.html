<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Drift — Reflection | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(7,17,28,.3), rgba(7,17,28,.88)),
        url('../assets/centroids/the-calm-night.png');
      overflow: hidden;
    }
    :root { --pose-filter: brightness(.68) saturate(.82); }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>
</head>
<body data-territory="drift">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_calm.png" alt="Que — Drift" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 05 &nbsp;·&nbsp; Melancholy</div>
          <h1>Drift</h1>
          <div class="episode-label">Episode 05</div>
          <div class="episode-body">Night settled in.

Not heavy—just honest.

Que walked slower here.

Memories lived in this space.
Unfinished thoughts.

Not all moods need fixing.

Some just need space.</div>
          <div class="btns">
            <a class="btn secondary" href="../index.html">Return to Origin</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/story-loader.js"></script>
</body>
</html>
