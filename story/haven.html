<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haven — Calm | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(7,17,28,.2), rgba(7,17,28,.8)),
        url('../assets/centroids/the-calm-night.png');
      overflow: hidden;
    }
    :root { --pose-filter: brightness(.72) saturate(.88); }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>
</head>
<body data-territory="haven">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_calm.png" alt="Que — Haven" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 04 &nbsp;·&nbsp; Peace</div>
          <h1>Haven</h1>
          <div class="episode-label">Episode 04</div>
          <div class="episode-body">Rain fell.

Soft. Constant.

Que didn't move.

Didn't need to.

Stillness isn't empty—
it's full of everything you've been avoiding.

He stayed…
until calm felt natural.</div>
          <div class="btns">
            <a class="btn" href="../origin.html">Home</a>
            <a class="btn secondary" href="drift.html">Next Territory</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/story-loader.js"></script>
</body>
</html>
