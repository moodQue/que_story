<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Flux — Chaos | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(20,10,5,.25), rgba(0,0,0,.82)),
        url('../assets/centroids/gathering-evening.png');
      overflow: hidden;
    }
    :root { --pose-filter: brightness(.82) sepia(.1) saturate(1.12); }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>
</head>
<body data-territory="flux">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_engaged.png" alt="Que — Flux" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 07 &nbsp;·&nbsp; Disruption</div>
          <h1>Flux</h1>
          <div class="episode-label">Episode 07</div>
          <div class="episode-body">Everything broke.

Patterns failed.
Rhythm collapsed.

Que smiled.

Because chaos isn't the end—

It's where new patterns are born.</div>
          <div class="btns">
            <a class="btn secondary" href="../index.html">Return to Origin</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/story-loader.js"></script>
</body>
</html>
