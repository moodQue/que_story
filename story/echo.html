<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo — Memory | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(10,5,20,.35), rgba(0,0,0,.82)),
        url('../assets/centroids/alleyway-music-day.png');
      overflow: hidden;
    }
    .pose {
      position: absolute;
      right: 0;
      bottom: 0;
      height: 95%;
      width: auto;
      object-fit: contain;
      object-position: bottom right;
      z-index: 2;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%);
      mask-image: linear-gradient(to right, transparent 0%, black 20%);
    }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>
</head>
<body>
  <main class="page">
    <section class="frame">
      <div class="hero">
        <img class="pose" src="../assets/poses/que_calm.png" alt="Que — Echo" />
        <div class="content">
          <div class="eyebrow">Territory 06 &nbsp;·&nbsp; Nostalgia</div>
          <h1>Echo</h1>
          <div class="episode-label">Episode 06</div>
          <div class="episode-body">A song played.

Old—but not forgotten.

Que paused.

Time folded in on itself.

Moments layered.

He realized:

Nothing truly leaves.

It just waits to be felt again.</div>
          <div class="btns">
            <a class="btn" href="../origin.html">Home</a>
            <a class="btn secondary" href="flux.html">Next Territory</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
