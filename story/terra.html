<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Terra — Grounding | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(5,10,18,.25), rgba(0,5,12,.82)),
        url('../assets/centroids/focus-night-workstation.png');
      overflow: hidden;
    }
    :root { --pose-filter: brightness(.72) saturate(.9); }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>
</head>
<body data-territory="terra">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_calm.png" alt="Que — Terra" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 11 &nbsp;·&nbsp; Stability</div>
          <h1>Terra</h1>
          <div class="episode-label">Episode 11</div>
          <div class="episode-body">He returned.

Not to a place—
but to balance.

Everything slowed.

Settled.

Strength isn't loud.

It's steady.</div>
          <div class="btns">
            <a class="btn secondary" href="../index.html">Return to Origin</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/story-loader.js"></script>
  <script src="../assets/social.js"></script>
</body>
</html>
