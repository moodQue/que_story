<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Veil — Mystery | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(10,5,20,.25), rgba(10,5,20,.82)),
        url('../assets/centroids/ethereal-night.png');
      overflow: hidden;
    }
    :root { --pose-filter: brightness(.8) saturate(1.15); }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>
</head>
<body data-territory="veil">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_engaged.png" alt="Que — Veil" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 10 &nbsp;·&nbsp; Unknown</div>
          <h1>Veil</h1>
          <div class="episode-label">Episode 10</div>
          <div class="episode-body">Not everything revealed itself.

And that was the point.

Que stepped forward anyway.

You don't need to see the whole path—

just the next step.</div>
          <div class="btns">
            <a class="btn secondary" href="../index.html">Return to Origin</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/story-loader.js"></script>
  <script src="../assets/social.js"></script>
</body>
</html>
