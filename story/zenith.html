<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenith — Alignment | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {

        linear-gradient(rgba(10,5,20,.2), rgba(10,5,20,.78)),
        url('../assets/centroids/ethereal-night.png');
      overflow: hidden;

    :root { --pose-filter: brightness(.84) saturate(1.2); }

    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }

<body data-territory="zenith">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_elevated.png" alt="Que — Zenith" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 12 &nbsp;·&nbsp; Mastery</div>
          <h1>Zenith</h1>
          <div class="episode-label">Episode 12</div>
          <div class="episode-body">All territories connected.

Not separate—
one system.

Que understood now:

He wasn't traveling through moods.

He was conducting them.</div>
          <div class="btns">
            <a class="btn" href="../origin.html">Home</a>
            <a class="btn secondary" href="../origin.html">Return to Origin</a>

        </div>
