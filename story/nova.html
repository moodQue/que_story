<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Nova — Inspiration | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(20,10,5,.15), rgba(0,0,0,.7)),
        url('../assets/centroids/gathering-afternoon.png');
      overflow: hidden;
    }
    :root { --pose-filter: brightness(.88) saturate(1.08); }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>
</head>
<body data-territory="nova">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_engaged.png" alt="Que — Nova" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 09 &nbsp;·&nbsp; Creation</div>
          <h1>Nova</h1>
          <div class="episode-label">Episode 09</div>
          <div class="episode-body">Something new formed.

Not from nothing—
but from everything before it.

Que watched ideas connect.

Creation isn't random.

It's recognition.</div>
          <div class="btns">
            <a class="btn secondary" href="../index.html">Return to Origin</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/story-loader.js"></script>
  <script src="../assets/social.js"></script>
</body>
</html>
