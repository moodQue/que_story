<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pulse — Momentum | MoodQue</title>
  <link rel="stylesheet" href="../css/centroids.css">
  <style>
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(5,10,20,.2), rgba(0,5,15,.8)),
        url('../assets/centroids/focus-day-workstation.png');
      overflow: hidden;
    }
    :root { --pose-filter: brightness(.86) saturate(1.05); }
    .content { position: relative; z-index: 3; }
    .episode-label { font-size: 12px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .episode-body { white-space: pre-line; color: var(--muted); font-size: 17px; line-height: 1.8; margin: 16px 0 28px; }
  </style>

<body data-territory="pulse">
  <main class="page">
    <section class="frame">
      <div class="hero">
        <div class="pose-wrap">
          <img class="pose" src="../assets/poses/que_elevated.png" alt="Que — Pulse" />
        </div>
        <div class="content">
          <div class="eyebrow">Territory 02 &nbsp;·&nbsp; Drive</div>
          <h1>Pulse</h1>
          <div class="episode-label">Episode 02</div>
          <div class="episode-body">The city moved fast.

Too fast for most.

But Que stepped into it—
matched it.

Heartbeat to traffic.
Energy to motion.

For a moment, everything aligned.

That's when he learned:

Momentum isn't chaos.

It's controlled fire.</div>
          <div class="btns">
            <a class="btn secondary" href="../index.html">Return to Origin</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/story-loader.js"></script>
  <script src="../assets/social.js"></script>
